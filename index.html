<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-adsense-account" content="ca-pub-1150602225072995">
    <meta http-equiv="refresh" content="3;url=https://cyprus-calculators.logicboxlab.com/">
    <title>LogicBox Lab - Smart Tools for Everyday Calculations</title>
    <meta name="description" content="LogicBox Lab - Building smart, privacy-focused calculation tools. Explore our Cyprus Tax Calculator and more.">
    <meta name="keywords" content="LogicBox Lab, Calculator, Tax Calculator, Cyprus, Tools">
    <meta name="author" content="LogicBox Lab">
    
    <!-- Open Graph -->
    <meta property="og:title" content="LogicBox Lab - Smart Tools for Everyday Calculations">
    <meta property="og:description" content="Building smart, privacy-focused calculation tools for everyone.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://logicboxlab.com">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧮%3C/text%3E%3C/svg%3E">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --accent-cyan: #00d4ff;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-display);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 8s ease-in-out infinite;
        }

        .glow-orb.cyan {
            width: 400px;
            height: 400px;
            background: var(--accent-cyan);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .glow-orb.purple {
            width: 350px;
            height: 350px;
            background: var(--accent-purple);
            bottom: -50px;
            left: -100px;
            animation-delay: -4s;
        }

        .glow-orb.pink {
            width: 250px;
            height: 250px;
            background: var(--accent-pink);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -2s;
            opacity: 0.2;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 2rem;
            max-width: 600px;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 5s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .tagline {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .redirect-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            margin-bottom: 2rem;
        }

        .redirect-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .destination {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.1);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 2px;
            animation: progress 3s linear forwards;
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .skip-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .skip-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .skip-link svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        .skip-link:hover svg {
            transform: translateX(4px);
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-secondary);
            font-size: 0.85rem;
            z-index: 10;
        }

        .footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }

            .logo {
                font-size: 3rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .destination {
                font-size: 0.75rem;
                word-break: break-all;
            }
        }
    </style>
</head>
<body>
    <!-- Background Effects -->
    <div class="bg-grid"></div>
    <div class="glow-orb cyan"></div>
    <div class="glow-orb purple"></div>
    <div class="glow-orb pink"></div>

    <!-- Main Content -->
    <div class="container">
        <div class="logo">🧮</div>
        <h1>LogicBox Lab</h1>
        <p class="tagline">Smart Tools for Everyday Calculations</p>

        <div class="redirect-box">
            <p class="redirect-text">Redirecting you to our flagship product...</p>
            <div class="destination">cyprus-calculators.logicboxlab.com</div>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
        </div>

        <a href="https://cyprus-calculators.logicboxlab.com/" class="skip-link">
            Go Now
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
        </a>
    </div>

    <div class="footer">
        © 2026 LogicBox Lab · <a href="https://cyprus-calculators.logicboxlab.com/">Cyprus Tax Calculator</a>
    </div>

    <!-- JavaScript redirect as backup -->
    <script>
        setTimeout(function() {
            window.location.href = 'https://cyprus-calculators.logicboxlab.com/';
        }, 3000);
    </script>
</body>
</html>
